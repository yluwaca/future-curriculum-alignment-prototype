[pytest]
testpaths = tests
pythonpath = .
addopts = -q
markers =
    smoke: fast API and dashboard smoke tests
    db: tests that require the configured database
    migration: Alembic migration state verification
    data_quality: repeatable data sanity checks

filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning
    ignore:The set_bad function will be deprecated in a future version.*:PendingDeprecationWarning:shap\.plots\.colors\._colors
    ignore:The set_over function will be deprecated in a future version.*:PendingDeprecationWarning:shap\.plots\.colors\._colors
    ignore:The set_under function will be deprecated in a future version.*:PendingDeprecationWarning:shap\.plots\.colors\._colors
    ignore:.*If you are loading a serialized model.*:UserWarning
