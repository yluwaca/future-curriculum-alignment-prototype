server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
    location = /ready { proxy_pass http://backend:8000/ready; proxy_set_header Host $host; }
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /docs { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
