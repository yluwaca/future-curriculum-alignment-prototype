name: ${COMPOSE_PROJECT_NAME:-future_prototype}

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-future}
      POSTGRES_USER: ${POSTGRES_USER:-future}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [future_internal]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment: &backend_environment
      ENVIRONMENT: ${ENVIRONMENT:-examiner}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-future}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-future}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080"]}
      DEBUG: "false"
      RELOAD: "false"
      ENABLE_BOOTSTRAP_ADMIN: "false"
      REQUIRE_HTTPS: "false"
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks: [future_internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend_environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - backend_data:/app/data
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=proxy"]
    networks: [future_internal]

  proxy:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/linux/nginx.examiner.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [future_internal]

networks:
  future_internal:
    internal: false

volumes:
  postgres_data:
  backend_data:
